name: Release Archivist

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: macos-latest
            target: 'mac:arm64'
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
          - os: ubuntu-latest
            target: 'linux:arm64'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js v25
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and Package Archivist
        run: bun run archivist:${{ matrix.target }}

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/executables/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
