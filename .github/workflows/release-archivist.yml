name: Release Archivist

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: macos-latest
            target: 'mac:arm64'
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
          - os: ubuntu-latest
            target: 'linux:arm64'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js v25
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Extract Version
        id: get_version
        shell: bash
        run: echo "VERSION=$(jq -r '.version' package.json)" >> $GITHUB_ENV

      - name: Build and Package Archivist
        run: bun run archivist:${{ matrix.target }}

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/executables/**/*-windows-*.exe
            dist/executables/**/*-mac-*.dmg
            dist/executables/**/*-mac-*.zip
            dist/executables/**/*-linux-*.AppImage
            dist/executables/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
